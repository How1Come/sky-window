plugins {
    id 'fabric-loom' version '1.10.5'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

sourceSets {
    clientTest
}

loom {
    splitEnvironmentSourceSets()
    mods {
        sky_window {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
        sky_window_client_test {
            sourceSet sourceSets.clientTest
        }
    }
    runs {
        clientSmoke {
            client()
            source(sourceSets.clientTest)
            runDir 'run/client-smoke'
            property 'sky_window.smoke.output', file(providers.gradleProperty('irisSmoke').isPresent()
                    ? 'build/render-test-iris' : providers.gradleProperty('resourceSmoke').isPresent()
                    ? 'build/render-test-resources' : 'build/render-test').absolutePath
            programArgs '--width', '1280', '--height', '720'
        }
    }
}

sourceSets.clientTest {
    compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
    runtimeClasspath += output + compileClasspath + sourceSets.client.runtimeClasspath
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'sky_window_gametest'
        enableGameTests = true
        enableClientGameTests = false
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    if (providers.gradleProperty('irisSmoke').isPresent()) {
        modLocalRuntime 'maven.modrinth:iris:zsoi0dso'
        modLocalRuntime 'maven.modrinth:sodium:u1OEbNKx'
        runtimeOnly 'org.anarres:jcpp:1.4.14'
        runtimeOnly 'io.github.douira:glsl-transformer:2.0.1'
        runtimeOnly 'org.antlr:antlr4-runtime:4.13.1'
    }
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

test {
    useJUnitPlatform()
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
